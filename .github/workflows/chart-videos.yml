name: Refresh chart video links
on:
  schedule:
    - cron: '27 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: chart-video-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - run: python3 scripts/refresh_chart_videos.py
      - name: Publish updated catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- chart-videos.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add chart-videos.json
            git commit -m 'Refresh YouTube links for chart tracks'
            git pull --rebase origin main
            git push origin HEAD:main
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
          fi
